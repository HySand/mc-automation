name: Minecraft promotion automation

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mc-promotion-automation
  cancel-in-progress: false

jobs:
  adapter:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - site: klpbbs
            label: KLPBBS
            klpbbs_enabled: ${{ vars.KLPBBS_ENABLED || 'false' }}
            minebbs_enabled: "false"
            wdsjfwq_enabled: "false"
            mclists_enabled: "false"
            browser_enabled: "false"
            ai_enabled: "false"
          - site: minebbs
            label: MineBBS
            klpbbs_enabled: "false"
            minebbs_enabled: ${{ vars.MINEBBS_ENABLED || 'false' }}
            wdsjfwq_enabled: "false"
            mclists_enabled: "false"
            browser_enabled: ${{ vars.MINEBBS_ESA_SLIDER_ENABLED || 'false' }}
            ai_enabled: "false"
          - site: wdsjfwq
            label: WDSJFWQ
            klpbbs_enabled: "false"
            minebbs_enabled: "false"
            wdsjfwq_enabled: ${{ vars.WDSJFWQ_ENABLED || 'false' }}
            mclists_enabled: "false"
            browser_enabled: "false"
            ai_enabled: ${{ vars.AI_SOLVER_ENABLED || 'false' }}
          - site: mclists
            label: MCLists
            klpbbs_enabled: "false"
            minebbs_enabled: "false"
            wdsjfwq_enabled: "false"
            mclists_enabled: ${{ vars.MCLISTS_ENABLED || 'false' }}
            browser_enabled: "false"
            ai_enabled: "false"

    runs-on: ${{ vars.AUTOMATION_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    env:
      MC_AUTOMATION_LOG_FORMAT: human
      KLPBBS_ENABLED: ${{ matrix.klpbbs_enabled }}
      KLPBBS_USERNAME: ${{ secrets.KLPBBS_USERNAME }}
      KLPBBS_PASSWORD: ${{ secrets.KLPBBS_PASSWORD }}
      KLPBBS_THREAD_ID: ${{ secrets.KLPBBS_THREAD_ID }}
      KLPBBS_BASE_URL: ${{ vars.KLPBBS_BASE_URL || 'https://klpbbs.com' }}
      KLPBBS_PROMOTION_ENABLED: ${{ matrix.klpbbs_enabled == 'true' && (vars.KLPBBS_PROMOTION_ENABLED || 'false') || 'false' }}
      KLPBBS_PROMOTION_URL: ${{ vars.KLPBBS_PROMOTION_URL }}
      KLPBBS_PROMOTION_VISIT_DELAY_SECONDS: ${{ vars.KLPBBS_PROMOTION_VISIT_DELAY_SECONDS || '0.5' }}
      MINEBBS_ENABLED: ${{ matrix.minebbs_enabled }}
      MINEBBS_USERNAME: ${{ secrets.MINEBBS_USERNAME }}
      MINEBBS_PASSWORD: ${{ secrets.MINEBBS_PASSWORD }}
      MINEBBS_THREAD_ID: ${{ secrets.MINEBBS_THREAD_ID }}
      MINEBBS_BASE_URL: ${{ vars.MINEBBS_BASE_URL || 'https://www.minebbs.com' }}
      MINEBBS_BUMP_INTERVAL_HOURS: ${{ vars.MINEBBS_BUMP_INTERVAL_HOURS || '16' }}
      MINEBBS_ESA_SLIDER_ENABLED: ${{ matrix.browser_enabled }}
      MINEBBS_BROWSER_EXECUTABLE_PATH: ${{ vars.MINEBBS_BROWSER_EXECUTABLE_PATH }}
      AI_SOLVER_ENABLED: ${{ matrix.ai_enabled }}
      AI_SOLVER_ENDPOINT: ${{ secrets.AI_SOLVER_ENDPOINT }}
      AI_SOLVER_API_KEY: ${{ secrets.AI_SOLVER_API_KEY }}
      AI_SOLVER_MODEL: ${{ vars.AI_SOLVER_MODEL }}
      AI_SOLVER_TIMEOUT_SECONDS: ${{ vars.AI_SOLVER_TIMEOUT_SECONDS || '60' }}
      AI_SOLVER_MAX_ATTEMPTS: ${{ vars.AI_SOLVER_MAX_ATTEMPTS || '1' }}
      AI_SOLVER_WDSJFWQ_CAPTCHA_ENABLED: ${{ matrix.wdsjfwq_enabled == 'true' && (vars.AI_SOLVER_WDSJFWQ_CAPTCHA_ENABLED || vars.AI_SOLVER_ENABLED || 'false') || 'false' }}
      WDSJFWQ_ENABLED: ${{ matrix.wdsjfwq_enabled }}
      WDSJFWQ_LIKE_URL: ${{ vars.WDSJFWQ_LIKE_URL || 'https://www.wdsjfwq.com/server-1991/vote.html' }}
      MCLISTS_ENABLED: ${{ matrix.mclists_enabled }}
      MCLISTS_LIKE_URL: ${{ vars.MCLISTS_LIKE_URL || 'https://www.mclists.cn/server/9969.html' }}
      RANK_THRESHOLD: ${{ vars.RANK_THRESHOLD || '8' }}
      PAID_BUMP_COOLDOWN_SECONDS: ${{ vars.PAID_BUMP_COOLDOWN_SECONDS || '3600' }}
      STATE_PATH: .state/state.json

    steps:
      - uses: actions/checkout@v4

      - name: Route application traffic through Cloudflare WARP
        uses: viperadnan-git/setup-warp@691f6aa5a251ed89ea27a85e890f6f5313c1a3b5
        with:
          mode: client
          stack: dual
          retries: "3"
          configure_docker: "false"

      - name: Verify Cloudflare WARP egress
        shell: bash
        run: |
          set -euo pipefail
          trace="$(curl --fail --silent --show-error --max-time 15 --retry 2 https://cloudflare.com/cdn-cgi/trace)"
          grep -Eq '^warp=(on|plus)$' <<< "$trace"
          grep -E '^(warp|loc)=' <<< "$trace"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Restore ${{ matrix.label }} state
        id: state_cache
        uses: actions/cache/restore@v4
        with:
          path: .state/state.json
          key: mc-automation-${{ matrix.site }}-state-v3-${{ github.run_id }}
          restore-keys: |
            mc-automation-${{ matrix.site }}-state-v3-
            mc-automation-state-v2-
            mc-automation-state-

      - name: Install application
        shell: bash
        run: |
          if [[ "$MINEBBS_ESA_SLIDER_ENABLED" == "true" ]]; then
            python -m pip install ".[browser]"
            if [[ -n "$MINEBBS_BROWSER_EXECUTABLE_PATH" ]]; then
              test -x "$MINEBBS_BROWSER_EXECUTABLE_PATH"
            else
              for candidate in google-chrome google-chrome-stable chromium-browser chromium; do
                if command -v "$candidate" >/dev/null; then
                  browser_path="$(command -v "$candidate")"
                  break
                fi
              done
              if [[ -z "${browser_path:-}" ]]; then
                echo "nodriver requires an installed Chrome/Chromium browser."
                exit 1
              fi
              echo "MINEBBS_BROWSER_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
              echo "MineBBS browser: $browser_path"
            fi
          else
            python -m pip install .
          fi

      - name: Run ${{ matrix.label }} automation
        id: automation
        shell: bash
        run: |
          mkdir -p .state
          set +e
          if [[ "$MINEBBS_ESA_SLIDER_ENABLED" == "true" ]]; then
            xvfb-run -a python -m mc_automation.cli
          else
            python -m mc_automation.cli
          fi
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save ${{ matrix.label }} state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state/state.json
          key: mc-automation-${{ matrix.site }}-state-v3-${{ github.run_id }}

      - name: Report ${{ matrix.label }} result
        if: always() && steps.automation.outputs.exit_code != '0'
        shell: bash
        env:
          AUTOMATION_EXIT_CODE: ${{ steps.automation.outputs.exit_code }}
        run: |
          echo "${{ matrix.label }} 需要处理（退出码 $AUTOMATION_EXIT_CODE），其他站点任务不受影响。"
          exit "$AUTOMATION_EXIT_CODE"
